# This is a Declarative Automation Bundle definition for dbx_bundle_20260922.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbx_bundle_20260922
  uuid: c2d140ce-1b18-48b6-92a4-459949f6cfc3

include:
  - resources/*.job.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-fb6c4cd9-8e67.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-fb6c4cd9-8e67.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/77f58f5d-03c0-4ce9-a724-ea37a18c3a45 to make sure we only have a single copy.
      root_path: /Workspace/Users/77f58f5d-03c0-4ce9-a724-ea37a18c3a45/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - service_principal_name: 77f58f5d-03c0-4ce9-a724-ea37a18c3a45
        level: CAN_MANAGE
