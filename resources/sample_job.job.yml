resources:
  jobs:
    onretail_job:
      name: onretail_job
      tasks:
        - task_key: create_bronze
          notebook_task:
            notebook_path: ../src/
            base_parameters:
              date: "{{job.trigger.time.day}}"
            source: WORKSPACE
        - task_key: create_silver
          depends_on:
            - task_key: create_bronze
          notebook_task:
            notebook_path: /Workspace/Users/dudwbstnrh@gmail.com/create_table_silver
            source: WORKSPACE
        - task_key: create_gold
          depends_on:
            - task_key: create_silver
          notebook_task:
            notebook_path: /Workspace/Users/dudwbstnrh@gmail.com/create_table_gold
            source: WORKSPACE
      queue:
        enabled: true
      run_as:
        user_name: dudwbstnrh@gmail.com
      performance_target: PERFORMANCE_OPTIMIZED
